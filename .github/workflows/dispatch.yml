name: Repo Dispatcher (legacy)

# LEGACY dispatcher. The modern entry point is `.github/workflows/build-r2s.yml`,
# which can be triggered directly from the Actions tab. This file is kept for
# reference only and is NOT scheduled to run automatically.
on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt tag/branch to forward to build-r2s.yml'
        default: 'v25.12.2'
        required: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Hint
        run: |
          echo "This dispatcher is deprecated. Please run the 'Build R2S'" \
               "workflow directly from the Actions tab."
          echo "Requested openwrt_ref: ${{ github.event.inputs.openwrt_ref }}"
