name: Build R2S

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt git tag or branch (e.g. v25.12.2 / openwrt-25.12 / master)'
        default: 'v25.12.2'
        required: true
      release:
        description: 'Publish the firmware to a GitHub Release'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
        required: true
      clean_build:
        description: 'Ignore caches and run a clean build'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
        required: true
      ssh_debug:
        description: 'Enable tmate SSH session for debugging on failure'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
        required: true
  push:
    branches:
      - 'test2'
      - 'ci/**'

concurrency:
  group: build-r2s-${{ github.ref }}-${{ github.event.inputs.openwrt_ref || 'default' }}
  cancel-in-progress: false

env:
  DEVICE: r2s
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build R2S firmware (${{ github.event.inputs.openwrt_ref || 'v25.12.2' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout repo config
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve build parameters
        id: params
        run: |
          ref="${{ github.event.inputs.openwrt_ref }}"
          if [ -z "$ref" ]; then ref="v25.12.2"; fi
          echo "openwrt_ref=$ref" >> "$GITHUB_OUTPUT"

          release="${{ github.event.inputs.release }}"
          if [ -z "$release" ]; then release="false"; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

          clean_build="${{ github.event.inputs.clean_build }}"
          if [ -z "$clean_build" ]; then clean_build="false"; fi
          echo "clean_build=$clean_build" >> "$GITHUB_OUTPUT"

          echo "build_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "build_tag=$(date +%Y.%m.%d)-r2s" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libzstd-dev lld llvm lrzsz mkisofs \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd jq
          sudo timedatectl set-timezone "$TZ" || true

      - name: Clone OpenWrt (${{ steps.params.outputs.openwrt_ref }})
        run: |
          set -e
          git clone --filter=blob:none https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git fetch --tags --depth=1 origin "${{ steps.params.outputs.openwrt_ref }}" || git fetch --depth=1 origin "${{ steps.params.outputs.openwrt_ref }}"
          git checkout "${{ steps.params.outputs.openwrt_ref }}"
          git log -1 --pretty=fuller

      - name: Restore ccache
        if: steps.params.outputs.clean_build != 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-r2s-${{ steps.params.outputs.openwrt_ref }}-${{ github.sha }}
          restore-keys: |
            ccache-r2s-${{ steps.params.outputs.openwrt_ref }}-
            ccache-r2s-

      - name: Restore dl cache
        if: steps.params.outputs.clean_build != 'true'
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-r2s-${{ steps.params.outputs.openwrt_ref }}-${{ github.sha }}
          restore-keys: |
            dl-r2s-${{ steps.params.outputs.openwrt_ref }}-
            dl-r2s-

      - name: Update feeds and merge third-party packages
        env:
          DEVICE: r2s
          OPENWRT_REF: ${{ steps.params.outputs.openwrt_ref }}
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Merge custom feeds / packages. merge_packages.sh is tolerant of failures by design.
          bash "$GITHUB_WORKSPACE/scripts/merge_packages.sh" || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply repo patches and defaults
        env:
          DEVICE: r2s
          OPENWRT_REF: ${{ steps.params.outputs.openwrt_ref }}
        run: |
          set -e
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/patches.sh" || true

      - name: Generate .config from seeds
        run: |
          set -e
          cd openwrt
          cat "$GITHUB_WORKSPACE/r2s.config.seed" \
              "$GITHUB_WORKSPACE/common.seed" \
              "$GITHUB_WORKSPACE/extra_packages.seed" > .config
          # Ensure ccache is on
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_BUILD_LOG=y" >> .config
          # Let make defconfig drop any package/symbol unknown to this tree.
          make defconfig
          echo "=============== resolved .config (packages) ==============="
          grep -E '^CONFIG_PACKAGE_.*=(y|m)$' .config | sort | head -n 200
          echo "==========================================================="

      - name: Verify required capabilities are selected
        id: verify
        run: |
          set -e
          cd openwrt
          missing=0
          required_any=(
            "luci-app-passwall|luci-app-passwall2|luci-app-ssr-plus"
            "luci-app-openclash"
            "luci-app-adguardhome"
            "luci-app-sqm|sqm-scripts"
            "ipv6helper|odhcp6c|odhcpd-ipv6only"
          )
          for group in "${required_any[@]}"; do
            hit=0
            for name in $(echo "$group" | tr '|' ' '); do
              if grep -q "^CONFIG_PACKAGE_${name}=[ym]$" .config; then
                echo "[ok] $name selected"
                hit=1
                break
              fi
            done
            if [ $hit -eq 0 ]; then
              echo "::warning::Required capability group missing: $group"
              missing=$((missing+1))
            fi
          done
          echo "missing_groups=$missing" >> "$GITHUB_OUTPUT"

      - name: Download sources
        run: |
          set -e
          cd openwrt
          make download -j8 V=s 2>&1 | grep -E "^(ERROR|make.*Error|.*failed)" || true

      - name: Compile toolchain and packages
        id: compile
        run: |
          set -e
          cd openwrt
          jobs=$(( $(nproc) + 1 ))
          echo "Using -j$jobs"
          set +e
          make -j$jobs IGNORE_ERRORS="n m" V=s 2>&1 | tail -n 4000
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Parallel build failed (rc=$rc); retrying with -j1 V=s for a readable log"
            make -j1 V=s 2>&1 | tail -n 6000
            exit 1
          fi

      - name: Collect firmware artifacts
        id: collect
        run: |
          set -e
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/release"
          # Copy raw images + checksums + config + manifest
          img=$(ls -1 bin/targets/rockchip/armv8/*nanopi-r2s*.img.gz 2>/dev/null | head -n1 || true)
          if [ -z "$img" ]; then
            echo "::error::No R2S img.gz produced"
            ls -R bin/targets || true
            exit 1
          fi
          name="r2s-$(date +%Y-%m-%d).img.gz"
          cp "$img" "$GITHUB_WORKSPACE/release/$name"
          ( cd "$GITHUB_WORKSPACE/release" && md5sum "$name" > "$name.md5" )
          gzip -dc "$GITHUB_WORKSPACE/release/$name" | md5sum | sed "s| -|  r2s-$(date +%Y-%m-%d).img|" > "$GITHUB_WORKSPACE/release/r2s-$(date +%Y-%m-%d).img.md5"
          cp .config "$GITHUB_WORKSPACE/release/r2s.config"
          manifest=$(ls -1 bin/targets/rockchip/armv8/*.manifest 2>/dev/null | head -n1 || true)
          [ -n "$manifest" ] && cp "$manifest" "$GITHUB_WORKSPACE/release/r2s.manifest" || true
          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2s-firmware-${{ steps.params.outputs.build_date }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.params.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.build_tag }}
          name: R2S ${{ steps.params.outputs.build_date }} (${{ steps.params.outputs.openwrt_ref }})
          body: |
            Automated R2S firmware build.
            - OpenWrt ref: `${{ steps.params.outputs.openwrt_ref }}`
            - Build date: `${{ steps.params.outputs.build_date }}`
            - Device: NanoPi R2S
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: SSH debug on failure
        if: ${{ failure() && github.event.inputs.ssh_debug == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
